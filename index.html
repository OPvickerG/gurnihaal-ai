<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OPV-GPT | Next-Gen AI</title>
  
  <!-- Fonts & Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #0a0510;
      --bg-sidebar: #10081a;
      --bg-card: rgba(30, 20, 50, 0.6);
      --bg-bubble-bot: #160f24;
      --border-color: rgba(255, 255, 255, 0.15);
      --accent-gradient: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #00e5ff 100%);
      --text-main: #ffffff;
      --text-muted: #a79fbb;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100dvh; overflow: hidden; }
    
    /* Layout */
    #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; backdrop-filter: blur(4px); }
    #sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s ease; position: fixed; height: 100%; z-index: 50; transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }
    #main-content { flex: 1; display: flex; flex-direction: column; width: 100%; transition: margin-left 0.3s ease; }
    
    @media (min-width: 768px) {
      #sidebar { transform: translateX(0); position: relative; }
      #sidebar-overlay { display: none !important; }
      #sidebar-toggle { display: none !important; }
    }

    /* Sidebar UI */
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
    .new-chat-btn { width: 100%; padding: 12px; background: var(--accent-gradient); border: none; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4); transition: transform 0.2s; }
    .new-chat-btn:active { transform: scale(0.96); }
    .history-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .history-item { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.9rem; transition: background 0.2s; }
    .history-item:hover, .history-item.active { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .history-item .del-btn { opacity: 0.5; border: none; background: transparent; color: #ff4444; font-size: 1.1rem; cursor: pointer; }
    .history-item:hover .del-btn { opacity: 1; }

    /* Header & Branding */
    header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); background: rgba(10, 5, 16, 0.85); backdrop-filter: blur(15px); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    #sidebar-toggle { background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; }
    
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 30px; height: 30px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; color: #fff; }
    .brand-text { display: flex; flex-direction: column; }
    .brand-title { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; color: #fff; line-height: 1.2; text-shadow: 0 2px 10px rgba(255, 0, 127, 0.3); }
    .brand-sub { font-size: 0.6rem; color: #00e5ff; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

    .mode-select { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; outline: none; appearance: none; cursor: pointer; }

    /* Chat Area */
    #chat-container { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    .hero-view { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0; text-align: center; padding: 20px; }
    .hero-badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #ff007f; background: rgba(255, 0, 127, 0.15); border: 1px solid rgba(255, 0, 127, 0.3); padding: 6px 14px; border-radius: 20px; margin-bottom: 12px; font-weight: 700; }
    .hero-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .starter-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 500px; width: 100%; margin-top: 20px;}
    .starter-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; text-align: left; cursor: pointer; transition: all 0.3s ease; }
    .starter-card:hover { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); transform: translateY(-2px); }
    .starter-title { font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .starter-sub { font-size: 0.75rem; color: var(--text-muted); }

    /* Bubbles */
    .message-row { display: flex; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; flex-direction: column; }
    .message-row.user { align-items: flex-end; }
    .message-row.bot { align-items: flex-start; }
    
    .bubble-wrapper { display: flex; gap: 10px; max-width: 100%; align-items: flex-start; }
    .message-row.user .bubble-wrapper { flex-direction: row-reverse; }
    
    .avatar { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; flex-shrink: 0; box-shadow: 0 0 10px rgba(121, 40, 202, 0.5); }
    
    .bubble { padding: 14px 18px; border-radius: var(--radius); font-size: 0.95rem; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; max-width: calc(100vw - 80px); }
    
    .user .bubble { background: var(--accent-gradient); color: #ffffff; border-bottom-right-radius: 4px; }
    .bot .bubble { background: var(--bg-bubble-bot); border: 1px solid var(--border-color); color: #e5e7eb; border-bottom-left-radius: 4px; width: 100%; overflow-x: auto;}
    
    /* Bot Action Bar */
    .action-bar { display: flex; gap: 12px; margin-top: 6px; margin-left: 40px; }
    .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
    .action-btn:hover { color: #00e5ff; }

    .user-action-bar { margin-right: 10px; margin-top: 6px; }

    /* Code Blocks */
    .bubble pre { background: #0d0d0d; border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto; position: relative; border: 1px solid var(--border-color); }
    .bubble code { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
    .copy-code-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .copy-code-btn:hover { background: #00e5ff; color: #000; font-weight: bold; }

    /* Footer */
    footer { padding: 16px; background: rgba(10, 5, 16, 0.9); border-top: 1px solid var(--border-color); backdrop-filter: blur(15px); }
    .input-box { max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; background: rgba(20, 15, 35, 0.8); border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.4); }
    .input-box:focus-within { border-color: #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.25); }
    
    .attach-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 8px; }
    .attach-btn:hover { color: #fff; }
    
    textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 1rem; outline: none; padding: 8px 0; resize: none; max-height: 120px; min-height: 24px; font-family: inherit;}
    textarea::placeholder { color: #6b6382; }
    
    .controls { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; }
    .main-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-gradient); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(121, 40, 202, 0.4); }
    .main-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .main-btn svg { width: 16px; height: 16px; fill: #ffffff; }
    
    #stop-btn { display: none; background: #ff4444; box-shadow: 0 0 15px rgba(255, 68, 68, 0.4); }

    /* File Badge */
    #file-badge { display: none; font-size: 0.75rem; background: rgba(0, 229, 255, 0.15); color: #00e5ff; padding: 4px 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(0, 229, 255, 0.3); word-break: break-all; }

    @media (max-width: 520px) { .starter-cards { grid-template-columns: 1fr; } .hero-title { font-size: 1.6rem; } }
  </style>
</head>
<body>

  <!-- Sidebar Overlay for Mobile -->
  <div id="sidebar-overlay"></div>

  <!-- History Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="startNewChat()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        New Chat
      </button>
    </div>
    <div class="history-list" id="history-list">
      <!-- Chat history items inject here -->
    </div>
  </aside>

  <!-- Main App -->
  <main id="main-content">
    <header>
      <div class="header-left">
        <button id="sidebar-toggle">☰</button>
        <div class="brand">
          <div class="logo-icon">O</div>
          <div class="brand-text">
            <div class="brand-title">OPV-GPT</div>
            <div class="brand-sub">Engineered by Gurnihaal</div>
          </div>
        </div>
      </div>
      <select class="mode-select" id="ai-mode" onchange="updateSystemPrompt()">
        <option value="general">⚡ General</option>
        <option value="coding">💻 Code</option>
        <option value="hardware">🔌 ESP32</option>
        <option value="math">📐 Math</option>
      </select>
    </header>

    <div id="chat-container">
      <div class="hero-view" id="hero">
        <div class="hero-badge">Autonomous Neural Core</div>
        <h1 class="hero-title">OPV-GPT</h1>
        <p class="hero-desc">High-precision intelligence for code prototyping, hardware debugging, and engineering.</p>
        
        <div class="starter-cards">
          <div class="starter-card" onclick="quickSend('Write a high-performance ESP32 Wi-Fi setup in C++')">
            <div class="starter-title">⚡ Firmware</div>
            <div class="starter-sub">Fast ESP32 Wi-Fi setup</div>
          </div>
          <div class="starter-card" onclick="quickSend('Design a 5V relay circuit with flyback diode protection')">
            <div class="starter-title">🔌 Circuits</div>
            <div class="starter-sub">Relay driver protection</div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div id="file-badge"></div>
      <div class="input-box">
        <label class="attach-btn">
          📎
          <input type="file" id="file-input" style="display: none;" accept=".txt,.py,.ino,.cpp,.c,.js,.html,.css,.json,.md">
        </label>
        <textarea id="user-input" placeholder="Message OPV-GPT..." rows="1" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
        <div class="controls">
          <button id="send-btn" class="main-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
          <button id="stop-btn" class="main-btn">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
          </button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    // System Configurations
    const API_KEY = "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";
    const MODEL = "openai/gpt-oss-20b";
    
    const PROMPTS = {
      general: "You are OPV-GPT, created by Gurnihaal (OPvickerG). You are sharp, chill, and give direct technical answers without conversational filler.",
      coding: "You are OPV-GPT, an elite senior software engineer. Provide highly optimized code. Minimal explanations, maximum efficiency.",
      hardware: "You are OPV-GPT, a master embedded systems engineer specializing in Arduino, ESP32, circuits, and C++. Output production-grade hardware advice.",
      math: "You are OPV-GPT, an advanced mathematics logic engine. Solve problems step-by-step with brutal accuracy."
    };

    // State
    let chats = JSON.parse(localStorage.getItem("opv_chats")) || [];
    let currentChatId = null;
    let historyMsg = [];
    let abortController = null;
    let pendingFileContent = "";

    // DOM Elements
    const chatContainer = document.getElementById("chat-container");
    const hero = document.getElementById("hero");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");
    const fileInput = document.getElementById("file-input");
    const fileBadge = document.getElementById("file-badge");
    const modeSelect = document.getElementById("ai-mode");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");
    const historyList = document.getElementById("history-list");

    // Markdown Setup
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      }
    });

    // --- Core Functions ---

    function init() {
      if(chats.length === 0) startNewChat();
      else loadChat(chats[0].id);
      renderSidebar();
    }

    function updateSystemPrompt() {
      if (historyMsg.length > 0) {
        historyMsg[0].content = PROMPTS[modeSelect.value];
        saveCurrentChat();
      }
    }

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

    function startNewChat() {
      currentChatId = generateId();
      historyMsg = [{ role: "system", content: PROMPTS[modeSelect.value] }];
      chatContainer.innerHTML = "";
      chatContainer.appendChild(hero);
      hero.style.display = "flex";
      chats.unshift({ id: currentChatId, title: "New Chat", messages: historyMsg });
      saveCurrentChat();
      renderSidebar();
      if(window.innerWidth < 768) toggleSidebar();
    }

    function loadChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      historyMsg = chat.messages;
      chatContainer.innerHTML = "";
      
      if (historyMsg.length <= 1) {
        chatContainer.appendChild(hero);
        hero.style.display = "flex";
      } else {
        hero.style.display = "none";
        for (let i = 1; i < historyMsg.length; i++) {
          renderBubble(historyMsg[i].content, historyMsg[i].role, false);
        }
      }
      renderSidebar();
      if(window.innerWidth < 768) toggleSidebar();
      setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 100);
    }

    function saveCurrentChat() {
      const idx = chats.findIndex(c => c.id === currentChatId);
      if (idx > -1) {
        chats[idx].messages = historyMsg;
        if (chats[idx].title === "New Chat" && historyMsg.length > 1) {
          let title = historyMsg[1].content.split("\n")[0].substring(0, 30);
          chats[idx].title = title + "...";
        }
      }
      localStorage.setItem("opv_chats", JSON.stringify(chats));
      renderSidebar();
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      localStorage.setItem("opv_chats", JSON.stringify(chats));
      if (currentChatId === id) startNewChat();
      else renderSidebar();
    }

    function renderSidebar() {
      historyList.innerHTML = "";
      chats.forEach(chat => {
        const div = document.createElement("div");
        div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
        div.onclick = () => loadChat(chat.id);
        div.innerHTML = `
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;">${chat.title}</span>
          <button class="del-btn" onclick="deleteChat(event, '${chat.id}')">×</button>
        `;
        historyList.appendChild(div);
      });
    }

    // --- UI & Interactions ---

    function toggleSidebar() {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("open");
    }
    document.getElementById("sidebar-toggle").onclick = toggleSidebar;
    overlay.onclick = toggleSidebar;

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      try {
        const text = await file.text();
        pendingFileContent = `\n\n[File Attached: ${file.name}]\n\`\`\`\n${text}\n\`\`\`\n`;
        fileBadge.style.display = "block";
        fileBadge.textContent = `📎 ${file.name} loaded.`;
      } catch (err) {
        alert("Could not read file.");
      }
      fileInput.value = "";
    });

    function editMessage(text) {
      input.value = text;
      input.focus();
    }

    function quickSend(promptText) {
      input.value = promptText;
      handleSend();
    }

    function renderBubble(text, role, animate = true) {
      if (hero) hero.style.display = "none";
      
      const row = document.createElement("div");
      row.className = `message-row ${role}`;
      
      const wrapper = document.createElement("div");
      wrapper.className = "bubble-wrapper";

      if (role === "bot") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "O";
        wrapper.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      
      if (role === "bot") {
        bubble.innerHTML = marked.parse(text);
        addCodeCopyButtons(bubble);
      } else {
        bubble.textContent = text;
      }
      
      wrapper.appendChild(bubble);
      row.appendChild(wrapper);

      if (role === "user") {
        const act = document.createElement("div");
        act.className = "user-action-bar action-bar";
        act.innerHTML = `<button class="action-btn" onclick="editMessage(\`${text.replace(/`/g, '\\`')}\`)">✏️ Edit</button>`;
        row.appendChild(act);
      } else if (role === "bot" && text !== "...") {
        const act = document.createElement("div");
        act.className = "action-bar";
        act.innerHTML = `
          <button class="action-btn" onclick="navigator.clipboard.writeText(\`${text.replace(/`/g, '\\`')}\`)">📋 Copy</button>
          <button class="action-btn" onclick="regenerateLast()">🔄 Retry</button>
        `;
        row.appendChild(act);
      }

      chatContainer.appendChild(row);
      if (animate) chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    function addCodeCopyButtons(element) {
      element.querySelectorAll('pre').forEach(pre => {
        if(pre.querySelector('.copy-code-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'copy-code-btn';
        btn.textContent = 'Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(pre.querySelector('code').innerText);
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 2000);
        };
        pre.appendChild(btn);
      });
    }

    // --- AI Communication ---

    async function handleSend() {
      let text = input.value.trim();
      if (!text && !pendingFileContent) return;

      if (pendingFileContent) {
        text += pendingFileContent;
        pendingFileContent = "";
        fileBadge.style.display = "none";
      }

      input.value = "";
      input.style.height = "";
      
      renderBubble(text, "user");
      historyMsg.push({ role: "user", content: text });
      saveCurrentChat();
      
      await fetchCompletion();
    }

    async function regenerateLast() {
      if(historyMsg.length < 2) return;
      if(historyMsg[historyMsg.length-1].role === "assistant") {
        historyMsg.pop();
        chatContainer.lastChild.remove();
      }
      await fetchCompletion();
    }

    async function fetchCompletion() {
      sendBtn.style.display = "none";
      stopBtn.style.display = "flex";
      input.disabled = true;

      const botBubble = renderBubble("...", "bot");
      const parentRow = botBubble.closest('.message-row');
      abortController = new AbortController();

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: historyMsg,
            stream: true
          }),
          signal: abortController.signal
        });

        if (!res.ok) throw new Error("API Error: " + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText = "";
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const dataStr = line.trim().slice(6);
              if (dataStr === "[DONE]") break;
              try {
                const data = JSON.parse(dataStr);
                const token = data.choices[0]?.delta?.content || "";
                fullText += token;
                
                let display = fullText.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
                botBubble.innerHTML = marked.parse(display || "...");
                addCodeCopyButtons(botBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } catch(e) {}
            }
          }
        }

        let finalReply = fullText.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
        historyMsg.push({ role: "assistant", content: finalReply });
        saveCurrentChat();
        
        const act = document.createElement("div");
        act.className = "action-bar";
        act.innerHTML = `
          <button class="action-btn" onclick="navigator.clipboard.writeText(\`${finalReply.replace(/`/g, '\\`')}\`)">📋 Copy</button>
          <button class="action-btn" onclick="regenerateLast()">🔄 Retry</button>
        `;
        parentRow.appendChild(act);

      } catch (err) {
        if (err.name === "AbortError") {
           botBubble.innerHTML += "<br><br><em>[Stopped by User]</em>";
           historyMsg.push({ role: "assistant", content: botBubble.innerText });
           saveCurrentChat();
        } else {
           botBubble.innerHTML = `⚠️ Error: ${err.message}`;
        }
      } finally {
        sendBtn.style.display = "flex";
        stopBtn.style.display = "none";
        input.disabled = false;
        input.focus();
        abortController = null;
      }
    }

    sendBtn.onclick = handleSend;
    stopBtn.onclick = () => { if(abortController) abortController.abort(); };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if(!input.disabled) handleSend();
      }
    });

    init();
  </script>
</body>
</html>
